<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% if page.tags %}<meta name="keywords" content="{{ page.tags | join: ',' }}">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">書</span>
        <span class="brand-text">
          <strong>{{ site.title }}</strong>
          <em>{{ site.tagline }}</em>
        </span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">目录</a>
        <a href="{{ '/catalog.html' | relative_url }}">总表</a>
        <a href="{{ '/about.html' | relative_url }}">关于</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>{{ site.title }} · 共 {{ site.data.books.size }} 个目录 · 内容仅供查阅与学习</p>
      <p class="muted">{{ site.author }} · 由 GitHub Pages + Jekyll 生成</p>
    </div>
  </footer>
</body>
</html>
