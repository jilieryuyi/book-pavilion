---
layout: default
---
<article class="book">
  <p class="crumb"><a href="{{ '/' | relative_url }}">← 返回目录</a></p>

  <header class="book-head">
    <h1>{{ page.title | default: "未命名" }}</h1>
    <div class="book-meta">
      {% if page.date %}<span>{{ page.date | date: "%Y-%m-%d" }}</span>{% endif %}
      {% if page.tags %}<span class="tags">{% for t in page.tags %}<i>{{ t }}</i>{% endfor %}</span>{% endif %}
    </div>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <aside class="qr qr-inline">
    <img src="{{ '/resources/wechat.png' | relative_url }}" alt="微信二维码" width="110" height="110">
    <div>
      <p class="qr-title">扫码找书</p>
      <p class="qr-note">微信扫一扫 · 长按识别<br>找书、询价、看其他目录</p>
    </div>
  </aside>
</article>
